name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # نصب فلاتر SDK
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      # ایجاد ساختار استاندارد پروژه فلاتر در همان مخزن
      - name: Create Flutter Project Structure
        run: |
          flutter create . --org com.example --project-name holo_accounting_app --force

      # جایگزین کردن فایل main.dart دلخواه شما (اگر فایل main.dart در ریشه است)
      # یا اگر فایل main.dart شما همین الان در lib/ است، دستور بالا آن را حفظ می‌کند.

      # دریافت پکیج‌ها
      - run: flutter pub get

      # ساخت فایل APK اندروید
      - run: flutter build apk --release

      # آپلود فایل APK به عنوان خروجی گیت‌هاب
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
